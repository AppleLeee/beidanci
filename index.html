  .card:hover {

  }
  .card .label { font-size: 17px; font-weight: 600; }

  /* 模式大卡片（首页两个入口） */

    background: #fff;
    border: 1px solid #eceef1;
    border-radius: 16px;
    padding: 28px 22px;
    cursor: pointer;
    transition: all .15s ease;
    text-align: center;
  }

    border-color: #1A56DB;

    font-weight: 600;

// ===== 状态 =====
const state = {
  mode: null,        // 'quiz' | 'wordlist'
  wl: null,
  unitIdx: null,
  roundQueue: [],
  pos: 0,
  roundNum: 1,
  wrongInRound: [],
};

const CHEERS = ["Perfect!", "Excellent!", "Great!", "Awesome!", "Brilliant!",
                "Well done!", "Correct!", "Nice!", "Fantastic!", "Superb!"];

// ===== Web Speech 英式发音 =====
let currentSpeakEl = null;
function speakUK(word, el) {
  if (!("speechSynthesis" in window)) {
    alert("当前浏览器不支持语音播放");
    return;
  }
  speechSynthesis.cancel();
  // 移除上一个高亮
  if (currentSpeakEl) currentSpeakEl.classList.remove("speaking");

  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-GB";
  u.rate = 0.85;
  // 尽量挑英式声音
  const voices = speechSynthesis.getVoices();
  const ukVoice = voices.find(v => /en-GB|en_GB|uk/i.test(v.lang + v.name))
               || voices.find(v => /en/i.test(v.lang));
  if (ukVoice) u.voice = ukVoice;

  currentSpeakEl = el;
  el.classList.add("speaking");
  u.onend = u.onerror = () => el.classList.remove("speaking");
  speechSynthesis.speak(u);
}
// 部分浏览器 voices 异步加载
if ("speechSynthesis" in window) speechSynthesis.getVoices();

// ===== 视图切换 =====
function show(id) {
  ["view-home","view-wl","view-units","view-quiz","view-review","view-done","view-wordlist"]
    .forEach(v => document.getElementById(v).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0, 0);
}

function goHome() { show("view-home"); }

// ===== 入口：选择模式 =====
function enterMode(mode) {
  state.mode = mode;
  renderWlList();
  show("view-wl");
}

// ===== 选 WL（两种模式共用） =====
function renderWlList() {
  document.getElementById("wl-title").textContent =
    state.mode === "quiz" ? "选择 Word List" : "选择 Word List";
  document.getElementById("wl-sub").textContent =
    state.mode === "quiz" ? "练习拼写" : "浏览单词表";
  const list = document.getElementById("wl-list");
  list.innerHTML = "";
  Object.keys(WORDS).sort().forEach(k => {
    const wl = WORDS[k];
    const totalWords = wl.all.length;
    const sub = state.mode === "quiz"
      ? `${wl.units.length} 个单元 · 共 ${totalWords} 词`
      : `共 ${totalWords} 词`;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div>
        <div class="label">Word List ${k}</div>
        <div class="sub">${sub}</div>
      </div>
      <div class="arrow">›</div>`;
    card.onclick = () => onWlSelected(k);
    list.appendChild(card);
  });
}

function onWlSelected(wlKey) {
  state.wl = wlKey;
  if (state.mode === "quiz") {
    showUnits();
  } else {
    renderWordlist();
  }
}

function goWlSelect() {
  speechSynthesis && speechSynthesis.cancel();
  renderWlList();
  show("view-wl");
}

// ===== 单词检测：选 Unit =====
function showUnits() {
  const wl = WORDS[state.wl];
  document.getElementById("unit-wl-title").textContent = `Word List ${state.wl}`;
  const list = document.getElementById("unit-list");
  list.innerHTML = "";
  wl.units.forEach((u, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div>
        <div class="label">${u.name}</div>
        <div class="sub">${u.words.length} 个词</div>
      </div>
      <div class="arrow">›</div>`;
    card.onclick = () => startQuiz(i);
    list.appendChild(card);
  });
  show("view-units");
}

// ===== 单词表：列出全部单词 =====
function renderWordlist() {
  const wl = WORDS[state.wl];
  document.getElementById("wl-view-title").textContent = `Word List ${state.wl} 单词表`;
  document.getElementById("wl-toolbar").textContent = `共 ${wl.all.length} 个单词 · 点击蓝色单词听英式发音`;
  const body = document.getElementById("wordlist-body");
  body.innerHTML = "";
  wl.all.forEach(w => {
    const div = document.createElement("div");
    div.className = "wl-item";
    const phon = w.p ? `<span class="wl-phon">${w.p}</span>` : "";
    div.innerHTML = `
      <span class="wl-en">${w.e}</span>${phon}
      <div class="wl-cn">${w.c}</div>`;
    div.querySelector(".wl-en").onclick = (e) => {
      speakUK(w.e, e.currentTarget);
    };
    body.appendChild(div);
  });
  show("view-wordlist");
}

// ===== 拼写流程 =====
function startQuiz(unitIdx) {
  state.unitIdx = unitIdx;
  const unit = WORDS[state.wl].units[unitIdx];
  state.roundQueue = unit.words.map(w => ({...w}));
  state.pos = 0;
  state.roundNum = 1;
  state.wrongInRound = [];
  show("view-quiz");
  renderQuestion();
}

// ===== 倒计时（CSS animation 驱动，丝滑） =====
let timerTOs = [];
let timeTotal = 0;
function getTimeLimit(word) {
  return Math.max(6, 4 + word.e.length);
}
function stopTimer() {
  timerTOs.forEach(clearTimeout);
  timerTOs = [];
  const fill = document.getElementById("timer-fill");
  if (fill) {
    fill.style.animation = "none";
    fill.style.width = "0%";
  }
}
function startTimer() {
  stopTimer();
  const word = state.roundQueue[state.pos];
  timeTotal = getTimeLimit(word);
  const fill = document.getElementById("timer-fill");
  // 重启 CSS 动画
  fill.style.animation = 'none';
  void fill.offsetWidth;
  fill.style.animation = `shrink ${timeTotal}s linear forwards`;
  fill.className = "timer-fill";

  // 颜色切换 & 超时检测（JS 只在关键时间点触发，不逐帧）
  timerTOs.push(setTimeout(() => fill.classList.add("warning"), timeTotal * 1000 * 0.4));
  timerTOs.push(setTimeout(() => fill.classList.add("danger"),  timeTotal * 1000 * 0.7));
  timerTOs.push(setTimeout(handleTimeout, timeTotal * 1000));
}

function hideNextButton() {
  document.getElementById("next-btn").classList.add("hidden");
}
function showNextButton() {
  document.getElementById("next-btn").classList.remove("hidden");
}

function renderQuestion() {
  const total = state.roundQueue.length;
  document.getElementById("progress-text").innerHTML =
    `第${state.roundNum}轮 <b>${Math.min(state.pos+1, total)}/${total}</b>`;

  const word = state.roundQueue[state.pos];
  document.getElementById("quiz-cn").textContent = word.c;
  const input = document.getElementById("quiz-input");
  input.value = "";
  input.className = "quiz-input";
  input.disabled = false;
  document.getElementById("quiz-feedback").innerHTML = "";
  hideNextButton();
  input.focus();
  startTimer();
}

function checkAnswer() {
  const input = document.getElementById("quiz-input");
  const userAns = input.value.trim();
  if (!userAns || input.disabled) return;
  stopTimer();
  const word = state.roundQueue[state.pos];
  const correct = word.e.trim().toLowerCase();
  const userNorm = userAns.toLowerCase();

  const fb = document.getElementById("quiz-feedback");

  if (userNorm === correct) {
    input.className = "quiz-input correct";
    input.disabled = true;
    fb.className = "feedback ok";
    fb.textContent = CHEERS[Math.floor(Math.random()*CHEERS.length)] + " ✓";
    setTimeout(nextQuestion, 550);
  } else {
    input.className = "quiz-input wrong";
    input.disabled = true;
    state.wrongInRound.push({ c: word.c, userAns: userAns, correctAns: word.e });
    fb.className = "feedback no";
    fb.innerHTML = `Wrong!<span class="right-ans">${word.e}</span>`;
    showNextButton();
  }
}

function handleTimeout() {
  const input = document.getElementById("quiz-input");
  if (input.disabled) return;  // 已提交过
  const word = state.roundQueue[state.pos];
  const userAns = input.value.trim();
  input.disabled = true;

  // 时间到了先判答案：写对了就算过
  if (userAns && userAns.toLowerCase() === word.e.toLowerCase()) {
    input.className = "quiz-input correct";
    const fb = document.getElementById("quiz-feedback");
    fb.className = "feedback ok";
    fb.textContent = "Just in time! ✓";
    setTimeout(nextQuestion, 800);
    return;
  }

  state.wrongInRound.push({ c: word.c, userAns: userAns || "超时", correctAns: word.e });
  const fb = document.getElementById("quiz-feedback");
  fb.className = "feedback no";
  fb.innerHTML = `Time's up!<span class="right-ans">${word.e}</span>`;
  showNextButton();
}

function nextQuestion() {
  state.pos++;
  if (state.pos < state.roundQueue.length) {
    renderQuestion();
  } else {
    endRound();
  }
}

function endRound() {
  if (state.wrongInRound.length === 0) {
    document.getElementById("done-sub").textContent =
      `Word List ${state.wl} · ${WORDS[state.wl].units[state.unitIdx].name} 已掌握`;
    show("view-done");
  } else {
    document.getElementById("review-title").textContent =
      `第 ${state.roundNum} 轮 · 错 ${state.wrongInRound.length} 词`;
    const tbody = document.getElementById("review-body");
    tbody.innerHTML = "";
    state.wrongInRound.forEach(w => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${w.c}</td>
        <td class="ans-wrong">${w.userAns}</td>
        <td class="ans-right">${w.correctAns}</td>`;
      tbody.appendChild(tr);
    });
    show("view-review");
  }
}

function startNextRound() {
  state.roundQueue = state.wrongInRound.map(w => {
    const src = WORDS[state.wl].units[state.unitIdx].words.find(x => x.e === w.correctAns);
    return { e: w.correctAns, p: src ? src.p : "", c: w.c };
  });
  state.pos = 0;
  state.roundNum++;
  state.wrongInRound = [];
  show("view-quiz");
  renderQuestion();
}

function quitQuiz() {
  stopTimer();
  document.getElementById("quit-modal").classList.remove("hidden");
}
function closeQuitModal() {
  document.getElementById("quit-modal").classList.add("hidden");
  // 取消退出，这题重新计时
  if (!document.getElementById("quiz-input").disabled) startTimer();
}
function confirmQuit() {
  document.getElementById("quit-modal").classList.add("hidden");
  showUnits();
}

// ===== 事件绑定 =====
document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("quiz-input");
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !input.disabled) checkAnswer();
  });
  show("view-home");
});
